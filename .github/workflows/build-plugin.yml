name: Build Plugin

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-dll:
    runs-on: windows-2025
    timeout-minutes: 20

    steps:
    - uses: actions/checkout@v5.0.0
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - uses: microsoft/setup-msbuild@v1.0.2

    - name: Hardening regression checks
      run: dotnet run --project tests/Hardening/Hardening.csproj

    - name: World synchronisation regression checks
      run: dotnet run --project tests/WorldSync/WorldSync.csproj

    - name: Diagnostics regression checks
      run: dotnet run --project tests/Diagnostics/Diagnostics.csproj

    - name: Download Valheim server assemblies
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        gh release download DepotDownloader_3.4.0 --repo SteamRE/DepotDownloader --pattern DepotDownloader-windows-x64.zip --dir depot
        if ($LASTEXITCODE -ne 0) { throw "DepotDownloader download failed" }
        Expand-Archive depot/DepotDownloader-windows-x64.zip -DestinationPath depot/tool
        & ./depot/tool/DepotDownloader.exe -app 896660 -os windows -filelist .depot-downloader-file-list.txt -dir serverfiles
        if ($LASTEXITCODE -ne 0) { throw "Valheim server assembly download failed" }
        if (!(Test-Path serverfiles/valheim_server_Data/Managed/assembly_valheim.dll)) { throw "Valheim assembly missing" }

    - name: Build release DLL
      run: |
        Copy-Item lib/* serverfiles/ -Recurse -Force
        msbuild src/Valheim_Serverside/Serverside_Simulations.csproj /restore /p:Configuration=Release "/p:SolutionDir=$env:GITHUB_WORKSPACE/" "/p:VALHEIM_DEDI_INSTALL=$env:GITHUB_WORKSPACE/serverfiles"
        if ($LASTEXITCODE -ne 0) { throw "Plugin build failed" }

    - name: Install Mono for game patch smoke tests
      run: |
        $installer = Join-Path $env:RUNNER_TEMP 'mono.msi'
        $installLog = Join-Path $env:RUNNER_TEMP 'mono-install.log'
        Invoke-WebRequest https://download.mono-project.com/archive/6.12.0/windows-installer/mono-6.12.0.206-x64-0.msi -OutFile $installer
        Get-Item $installer | Select-Object FullName, Length
        $install = Start-Process msiexec.exe -ArgumentList "/i `"$installer`" /qn /norestart /L*v `"$installLog`"" -Wait -PassThru
        if ($install.ExitCode -notin @(0, 3010)) {
          if (Test-Path $installLog) { Get-Content $installLog -Tail 60 }
          throw "Mono install failed: $($install.ExitCode)"
        }
        & "$env:ProgramFiles/Mono/bin/mono.exe" --version
        if ($LASTEXITCODE -ne 0) { throw "Mono runtime missing" }

    - name: Real game patch smoke tests
      run: |
        dotnet build tests/GamePatchSmoke/GamePatchSmoke.csproj -c Release
        if ($LASTEXITCODE -ne 0) { throw "Patch smoke-test build failed" }
        & "$env:ProgramFiles/Mono/bin/mono.exe" ./tests/GamePatchSmoke/bin/Release/net472/GamePatchSmoke.exe serverfiles bin/Release/Northwatch_Dedicated_Simulation.dll
        if ($LASTEXITCODE -ne 0) { throw "Real game patch installation failed" }

    - name: Upload DLL
      uses: actions/upload-artifact@v4.6.2
      with:
        name: northwatch-${{ github.sha }}
        path: bin/Release/Northwatch_Dedicated_Simulation.dll
        if-no-files-found: error
